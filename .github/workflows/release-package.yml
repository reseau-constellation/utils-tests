name: Node.js Package

on:
  release:
    types: [created]

jobs:

  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Installer pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
      
      - name: Installer
        run: pnpm install
      
      - run: pnpm publier
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}